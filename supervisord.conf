[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[program:uvicorn]
command=/usr/local/bin/uv run uvicorn openbb_app.main:app --host 0.0.0.0 --port 8001
directory=/app
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/uvicorn.log
stderr_logfile=/var/log/supervisor/uvicorn_err.log
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",UV_CACHE_DIR="/home/appuser/.cache/uv",OPENBB_USER_DATA_PATH="/home/appuser/OpenBBUserData",HOME="/home/appuser"

[program:opencode]
command=/usr/bin/opencode serve --hostname 0.0.0.0 --port 4096
directory=/home/appuser
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/opencode.log
stderr_logfile=/var/log/supervisor/opencode_err.log
environment=HOME="/home/appuser"

[program:vibe-trading-serve]
command=/usr/local/bin/vibe-trading serve --host 0.0.0.0 --port 8899
directory=/home/appuser
user=appuser
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/vibe-trading-serve.log
stderr_logfile=/var/log/supervisor/vibe-trading-serve_err.log
environment=HOME="/home/appuser",VIBE_TRADING_HOME="/opt/vibe-trading"